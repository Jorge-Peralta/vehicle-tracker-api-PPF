# Local PostgreSQL for development and tests.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: vehicle-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vehicle_tracker
      POSTGRES_PASSWORD: vehicle_tracker
      POSTGRES_DB: vehicle_tracker
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the vehicle_tracker_test database on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vehicle_tracker -d vehicle_tracker']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
