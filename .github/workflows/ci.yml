name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Postgres for migrations and integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vehicle_tracker
          POSTGRES_PASSWORD: vehicle_tracker
          POSTGRES_DB: vehicle_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vehicle_tracker:vehicle_tracker@localhost:5432/vehicle_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
